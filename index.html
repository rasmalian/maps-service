<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Login - Klipang Green 2 Monitor</title>

  <!-- Instant Session Check: Jika sudah login, langsung ke .yayahay -->
  <script>
    (function() {
      try {
        var token = sessionStorage.getItem('kg2_auth_token') || localStorage.getItem('kg2_auth_token');
        if (token) {
          window.location.replace('.yayahay');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070b14;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-glow: rgba(16, 185, 129, 0.25);
      --accent: #3b82f6;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --danger-border: rgba(239, 68, 68, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(2, 6, 23, 0.7);
      --input-border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-badge {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #10b981 0%, #047857 100%);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 10px 25px -5px var(--primary-glow);
      margin-bottom: 14px;
      position: relative;
    }

    .logo-badge svg {
      width: 30px;
      height: 30px;
    }

    .status-pulse {
      position: absolute;
      top: -3px;
      right: -3px;
      width: 12px;
      height: 12px;
      background: #10b981;
      border: 2px solid var(--bg-dark);
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.7; }
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 30px 26px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e2e8f0;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .card-title svg {
      color: var(--primary);
    }

    .alert-box {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: #fca5a5;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.4;
      transition: all 0.2s ease;
    }

    .alert-box.hidden {
      display: none;
    }

    .alert-box.success {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }

    .alert-box svg {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin-top: 1px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: #64748b;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 13px 44px 13px 44px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
      background: rgba(15, 23, 42, 0.95);
    }

    .input-wrapper input::placeholder {
      color: #475569;
    }

    .btn-toggle-pass {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 6px;
      border-radius: 8px;
      transition: color 0.2s;
    }

    .btn-toggle-pass:hover {
      color: var(--text-main);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 13px;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text-muted);
      user-select: none;
    }

    .remember-label input[type="checkbox"] {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 20px -4px var(--primary-glow);
      transition: all 0.2s ease;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px -4px rgba(16, 185, 129, 0.4);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      filter: grayscale(30%);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .btn-submit.loading .spinner {
      display: block;
    }

    .btn-submit.loading .btn-text,
    .btn-submit.loading svg:not(.spinner) {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .card-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .footer-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
    }

    /* Shake animation saat error */
    .shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
  </style>
</head>
<body>

  <div class="login-container">
    
    <!-- Header Brand -->
    <div class="brand-header">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span class="status-pulse"></span>
      </div>
      <h1 class="brand-title">Klipang Green 2</h1>
      <p class="brand-subtitle">Sistem Keamanan & Monitoring Lingkungan</p>
    </div>

    <!-- Login Card -->
    <div class="login-card" id="loginCard">
      <div class="card-title">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>Portal Akses Petugas</span>
      </div>

      <!-- Alert Notification -->
      <div id="loginAlert" class="alert-box hidden" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="alertText">Username atau password salah!</span>
      </div>

      <!-- Form -->
      <form id="loginForm" autocomplete="on">
        
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input 
              type="text" 
              id="username" 
              name="username" 
              placeholder="Masukkan username" 
              required 
              autocapitalize="none"
              autocomplete="username"
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="Masukkan password" 
              required
              autocomplete="current-password"
            >
            <button type="button" class="btn-toggle-pass" id="btnTogglePass" title="Tampilkan/Sembunyikan Password" aria-label="Toggle Password">
              <svg id="eyeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe" checked>
            <span>Ingat saya di perangkat ini</span>
          </label>
        </div>

        <button type="submit" class="btn-submit" id="btnLogin">
          <div class="spinner"></div>
          <span class="btn-text">Masuk ke Sistem</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>

      </form>

      <div class="card-footer">
        <span class="footer-dot"></span>
        <span>Terkoneksi aman ke Cloudflare Edge Worker</span>
      </div>

    </div>

  </div>

  <script>
    // Konfigurasi Endpoint Worker Cloudflare
    const AUTH_ENDPOINT = 'https://summer-rt9.demigod1337.workers.dev/auth';

    const loginForm = document.getElementById('loginForm');
    const loginCard = document.getElementById('loginCard');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const rememberMeCheckbox = document.getElementById('rememberMe');
    const btnLogin = document.getElementById('btnLogin');
    const btnTogglePass = document.getElementById('btnTogglePass');
    const eyeIcon = document.getElementById('eyeIcon');
    const loginAlert = document.getElementById('loginAlert');
    const alertText = document.getElementById('alertText');

    // Toggle Tampilkan / Sembunyikan Password
    btnTogglePass.addEventListener('click', () => {
      const isPass = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPass ? 'text' : 'password');
      if (isPass) {
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    });

    function showAlert(msg, isSuccess = false) {
      alertText.textContent = msg;
      loginAlert.className = isSuccess ? 'alert-box success' : 'alert-box';
      loginAlert.classList.remove('hidden');

      if (!isSuccess) {
        loginCard.classList.remove('shake');
        void loginCard.offsetWidth; // Trigger reflow
        loginCard.classList.add('shake');
      }
    }

    function hideAlert() {
      loginAlert.classList.add('hidden');
    }

    // Submit Handler
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showAlert('Silakan masukkan username dan password.');
        return;
      }

      // Set Loading State
      btnLogin.disabled = true;
      btnLogin.classList.add('loading');

      try {
        const response = await fetch(AUTH_ENDPOINT, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json().catch(() => ({}));

        if (response.ok && data.ok) {
          showAlert('Login berhasil! Mengalihkan...', true);

          // Simpan Token Sesi
          const storage = rememberMeCheckbox.checked ? localStorage : sessionStorage;
          storage.setItem('kg2_auth_token', data.token || 'authenticated');
          storage.setItem('kg2_auth_user', data.user || username);

          // Jika pilih simpan di salah satu, bersihkan storage satunya agar rapi
          if (rememberMeCheckbox.checked) {
            sessionStorage.removeItem('kg2_auth_token');
          } else {
            localStorage.removeItem('kg2_auth_token');
          }

          // Alihkan ke .yayahay (atau yayahay.html)
          setTimeout(() => {
            window.location.replace('.yayahay');
          }, 400);

        } else {
          const errMsg = data.message || (response.status === 401 
            ? 'Username atau password salah!' 
            : 'Gagal melakukan verifikasi akun.');
          showAlert(errMsg);
          passwordInput.value = '';
          passwordInput.focus();
        }

      } catch (err) {
        console.error('Auth request error:', err);
        showAlert('Gagal terhubung ke server Cloudflare. Pastikan koneksi internet aktif.');
      } finally {
        btnLogin.disabled = false;
        btnLogin.classList.remove('loading');
      }
    });
  </script>

</body>
</html>
